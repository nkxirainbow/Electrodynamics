      /* 内联关键样式，确保外部 CSS 加载前 Loading 动画也能立即显示 */
      #loadingIndicator {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #ffffff; /* 明确背景色，避免闪烁 */
        z-index: 10000;
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      .wave-bars {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 50px;
      }
      .wave-bars i {
        width: 5px;
        height: 18px;
        background: linear-gradient(to bottom, #2253bd, #60a5fa);
        border-radius: 10px;
        animation: wave-logic 1s ease-in-out infinite;
      }
      .wave-bars i:nth-child(1) {
        animation-delay: 0.1s;
      }
      .wave-bars i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .wave-bars i:nth-child(3) {
        animation-delay: 0.3s;
      }
      .wave-bars i:nth-child(4) {
        animation-delay: 0.4s;
      }
      .wave-bars i:nth-child(5) {
        animation-delay: 0.5s;
      }
      @keyframes wave-logic {
        0%,
        100% {
          height: 15px;
          transform: scaleY(1);
          opacity: 0.4;
        }
        50% {
          height: 35px;
          transform: scaleY(1.2);
          opacity: 1;
        }
      }
    </style>
